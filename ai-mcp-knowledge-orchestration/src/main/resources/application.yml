spring:
  application:
    name: ai-model-orchestration

  # MySQL 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/ai_model_orchestration?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA 配置
  jpa:
    database: mysql
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Spring AI 配置
  ai:
    # OpenAI 配置
    openai:
      base-url: http://127.0.0.1:8045
      api-key: sk-1256419209eb47ccbabaa98abccfe4c8
      chat:
        options:
          model: gpt-4

    # Anthropic 配置
    anthropic:
      base-url: https://api.anthropic.com
      api-key: sk-ant-api-key-placeholder
      chat:
        options:
          model: claude-3-5-sonnet-20241022

    # Google Gemini 配置
    google:
      genai:
        base-url: http://127.0.0.1:8045
        api-key: sk-1256419209eb47ccbabaa98abccfe4c8
        chat:
          options:
            model: gemini-3-flash

# 日志配置
logging:
  level:
    com.xbk.knowledge.orchestration: DEBUG
    org.springframework.ai: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# 服务器配置
server:
  port: 8081
