server:
  # 生产环境端口
  port: 8090

spring:
  data:
    redis:
      # Redis 地址（按生产环境修改）
      host: localhost
      # Redis 端口
      port: 6379
  datasource:
    mysql:
      # 生产环境数据库配置（请按实际环境调整）
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: root
      password: root
      url: jdbc:mysql://localhost:3306/ai_model_orchestration?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      type: com.alibaba.druid.pool.DruidDataSource
      druid:
        # 初始化连接数
        initial-size: 5
        # 最小空闲连接数
        min-idle: 5
        # 最大活动连接数
        max-active: 20
        # 获取连接最大等待时间
        max-wait: 60000
        # 空闲连接检查间隔
        time-between-eviction-runs-millis: 60000
        # 连接最小生存时间
        min-evictable-idle-time-millis: 300000
        # 连接校验
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
    pgvector:
      # 生产环境数据库配置（请按实际环境调整）
      driver-class-name: org.postgresql.Driver
      username: postgres
      password: postgres
      url: jdbc:postgresql://192.168.1.109:15432/ai-rag-knowledge
      type: com.zaxxer.hikari.HikariDataSource
      # Hikari 连接池配置
      hikari:
        # 连接池名
        pool-name: HikariCP
        # 最小空闲连接数
        minimum-idle: 5
        # 空闲连接存活最大时间，默认10分钟
        idle-timeout: 600000
        # 连接池最大连接数，默认是10
        maximum-pool-size: 10
        # 是否自动提交（默认 true）
        auto-commit: true
        # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
        max-lifetime: 1800000
        # 数据库连接超时时间（默认 30 秒）
        connection-timeout: 30000
        # 连接测试 SQL
        connection-test-query: SELECT 1

# Redis
redis:
  sdk:
    config:
      # Redis 连接参数（生产环境）
      host: 192.168.1.109
      port: 16379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

logging:
  level:
    root: info
  config: classpath:logback-spring.xml

# 向量存储表名配置
vector:
  store:
    openai:
      table-name: vector_store_openai
    ollama:
      table-name: vector_store_ollama_deepseek
