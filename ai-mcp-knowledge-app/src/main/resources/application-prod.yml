server:
  # 生产环境端口
  port: 8090

spring:
  datasource:
    # 生产环境数据库配置（请按实际环境调整）
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
    url: jdbc:postgresql://192.168.1.109:15432/ai-rag-knowledge
    type: com.zaxxer.hikari.HikariDataSource
    # Hikari 连接池配置
    hikari:
      # 连接池名
      pool-name: HikariCP
      # 最小空闲连接数
      minimum-idle: 5
      # 空闲连接存活最大时间，默认10分钟
      idle-timeout: 600000
      # 连接池最大连接数，默认是10
      maximum-pool-size: 10
      # 是否自动提交（默认 true）
      auto-commit: true
      # 此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认30分钟
      max-lifetime: 1800000
      # 数据库连接超时时间（默认 30 秒）
      connection-timeout: 30000
      # 连接测试 SQL
      connection-test-query: SELECT 1
  ai:
    ollama:
      # Ollama 服务地址
      base-url: http://192.168.1.109:11434
      embedding:
        options:
          num-batch: 512
        model: nomic-embed-text
    openai:
      # OpenAI 兼容服务地址
      base-url: https://pro-share-aws-api.zcyai.com/
      # 建议用环境变量或外部配置替换真实密钥
      api-key: sk-eEyfxptPgbfXd3Z164260740E0494161Bd8**找小傅哥申请
      embedding-model: text-embedding-ada-002
    rag:
      # 默认嵌入模型（可选：nomic-embed-text / text-embedding-ada-002）
      embed: nomic-embed-text


# Redis
redis:
  sdk:
    config:
      # Redis 连接参数（生产环境）
      host: 192.168.1.109
      port: 16379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

logging:
  level:
    root: info
  config: classpath:logback-spring.xml
