server:
  # 本地开发端口
  port: 8090

spring:
  datasource:
    mysql:
      # 数据库驱动（MySQL）
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 数据库账号
      username: root
      # 数据库密码
      password: root
      # 数据库地址（请根据本机环境调整）
      url: jdbc:mysql://localhost:3306/ai_model_orchestration?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      type: com.alibaba.druid.pool.DruidDataSource
      druid:
        # 初始化连接数
        initial-size: 5
        # 最小空闲连接数
        min-idle: 5
        # 最大活动连接数
        max-active: 20
        # 获取连接最大等待时间
        max-wait: 60000
        # 空闲连接检查间隔
        time-between-eviction-runs-millis: 60000
        # 连接最小生存时间
        min-evictable-idle-time-millis: 300000
        # 连接校验
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
    pgvector:
      # 数据库驱动（PostgreSQL）
      driver-class-name: org.postgresql.Driver
      # 数据库账号
      username: postgres
      # 数据库密码
      password: postgres
      # 数据库地址（请根据本机环境调整）
      url: jdbc:postgresql://localhost:5432/ai-rag-knowledge
      type: com.zaxxer.hikari.HikariDataSource
  ai:
    mcp:
      client:
        # MCP Client 超时时间（与外部工具交互时可能较长）
        request-timeout: 360s
    google:
      genai:
        # Google GenAI SDK 模式的代理服务
        base-url: http://127.0.0.1:8045
        # 请替换为你自己的 API Key
        api-key: sk-1256419209eb47ccbabaa98abccfe4c8
        chat:
          options:
            # 默认模型
            model: gemini-3-flash
    openai:
      # OpenAI 兼容接口代理地址
      base-url: http://127.0.0.1:8045
      # 请替换为你自己的 API Key
      api-key: sk-1256419209eb47ccbabaa98abccfe4c8
      chat:
        options:
          # 默认模型
          model: gemini-3-flash
      embedding-model: text-embedding-ada-002
      embedding:
        options:
          # 向量批次大小（根据 GPU/内存调整）
          num-batch: 1536
    ollama:
      # 本地/私有化模型服务地址
      base-url: http://1b349d2280564f15a7ef-deepseek-r1-llm-api.gcs-xy1a.jdcloud.com/
      embedding-model: nomic-embed-text
      embedding:
        options:
          # 向量批次大小（根据 GPU/内存调整）
          num-batch: 768

# 向量存储表名配置
vector:
  store:
    openai:
      # OpenAI 向量表名
      table-name: vector_store_openai
    ollama:
      # Ollama 向量表名
      table-name: vector_store_ollama_deepseek

logging:
  # 日志输出目录
  path: /Users/sxie/xbk/ai-mcp-knowledge-study/logs/app
  level:
    # 默认日志级别
    root: info
  config: classpath:logback-spring.xml
