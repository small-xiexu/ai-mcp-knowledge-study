server:
  # 本地开发端口
  port: 8090

spring:
  main:
    # 设为 none 会禁用 Web 接口；需要对外提供 HTTP 时请改为 servlet
    web-application-type: none
  datasource:
    # 数据库驱动（当前为 PostgreSQL）
    driver-class-name: org.postgresql.Driver
    # 数据库账号
    username: postgres
    # 数据库密码
    password: postgres
    # 数据库地址（请根据本机环境调整）
    url: jdbc:postgresql://localhost:5432/ai-rag-knowledge
    type: com.zaxxer.hikari.HikariDataSource
  ai:
    mcp:
      client:
        # MCP Client 超时时间（与外部工具交互时可能较长）
        request-timeout: 360s
        stdio:
          # MCP 工具配置文件（指向本地可执行 MCP Server JAR）
          servers-configuration: classpath:/config/mcp-servers-config.json
    google:
      genai:
        # Google GenAI SDK 模式的代理服务
        base-url: http://127.0.0.1:8045
        # 请替换为你自己的 API Key
        api-key: sk-1256419209eb47ccbabaa98abccfe4c8
        chat:
          options:
            # 默认模型
            model: gemini-3-flash
    openai:
      # OpenAI 兼容接口代理地址
      base-url: http://127.0.0.1:8045
      # 请替换为你自己的 API Key
      api-key: sk-1256419209eb47ccbabaa98abccfe4c8
      chat:
        options:
          # 默认模型
          model: gemini-3-flash
      embedding-model: text-embedding-ada-002
      embedding:
        options:
          # 向量批次大小（根据 GPU/内存调整）
          num-batch: 1536
    ollama:
      # 本地/私有化模型服务地址
      base-url: http://1b349d2280564f15a7ef-deepseek-r1-llm-api.gcs-xy1a.jdcloud.com/
      embedding-model: nomic-embed-text
      embedding:
        options:
          # 向量批次大小（根据 GPU/内存调整）
          num-batch: 768

# 向量存储表名配置
vector:
  store:
    openai:
      # OpenAI 向量表名
      table-name: vector_store_openai
    ollama:
      # Ollama 向量表名
      table-name: vector_store_ollama_deepseek

logging:
  # 日志输出目录
  path: /Users/sxie/xbk/ai-mcp-knowledge-study/logs/app
  level:
    # 默认日志级别
    root: info
  config: classpath:logback-spring.xml
