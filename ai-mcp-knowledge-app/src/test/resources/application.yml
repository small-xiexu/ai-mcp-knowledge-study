spring:
  profiles:
    active: test
  autoconfigure:
    exclude:
      # 移除 MCP 相关的排除，允许 MCP 工具自动注册
      # - org.springframework.ai.mcp.client.common.autoconfigure.McpClientAutoConfiguration
      # - org.springframework.ai.mcp.client.common.autoconfigure.McpToolCallbackAutoConfiguration
      - org.springframework.ai.mcp.server.common.autoconfigure.ToolCallbackConverterAutoConfiguration
      # ✅ 启用 ToolCallingAutoConfiguration 以支持工具调用
      # - org.springframework.ai.model.tool.autoconfigure.ToolCallingAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
  datasource:
    url: jdbc:h2:mem:ai_mcp_knowledge_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: never

# 日志配置 - 用于调试 MCP 工具调用
logging:
  level:
    org.springframework.ai.mcp: DEBUG
    org.springframework.ai.model.tool: DEBUG
    com.xbk.knowledge: DEBUG
